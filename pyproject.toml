[project]
name = "menu-builder"
version = "0.1.0"
description = "Recipe building and real-time menu costing for a single-site restaurant in Costa Rica"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
