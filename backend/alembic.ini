# Alembic, the schema-migration system that replaced `create_all` on
# 2026-09-07 -- PLAN.md D15's known debt, and the last piece of it left
# once `restaurant-manager` retired its own the same day.
#
# Ported from upstream's `backend/alembic.ini` deliberately unchanged
# except for the names: D2 says conventions transfer verbatim between the
# two repos, and a migration runner the operator has to remember two sets
# of commands for is exactly the kind of drift that rule exists to stop.
#
# This file lives in backend/ rather than at the repo root on purpose:
# backend/ is the Docker build context (docker-compose.yml's `build:
# ./backend`), so nothing above it can be copied into the image. The
# container's WORKDIR is /srv, which is where this lands -- so inside the
# container `alembic upgrade head` needs no -c and no cd.
#
# From the host, run it with an explicit config:
#     alembic -c backend/alembic.ini <command>
# `%(here)s` below is what makes that work -- without it Alembic resolves
# script_location against the *current* directory and cannot find the
# migrations from anywhere but backend/.

[alembic]
script_location = %(here)s/migrations

# The database URL deliberately is NOT set here. migrations/env.py reads
# `app.config.settings.database_url` instead, so Alembic and the app can
# never be pointed at two different databases -- and no credential is
# committed. See that file's own note.
sqlalchemy.url =

# A migration's filename leads with the date it was written, so
# `ls versions/` reads in chronological order rather than in hash order.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Alembic's own default is os.pathsep (";" on Windows, ":" elsewhere).
# Pinning it to os.pathsep-independent "space" keeps a path list meaning
# the same thing on the operator's Windows host and inside the Linux
# container.
version_path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
